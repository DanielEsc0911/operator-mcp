name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/pack-check.mjs
      - name: Pack the tarball that will be published
        run: mkdir -p tarball && npm pack --pack-destination tarball
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tarball
          path: tarball/*.tgz

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Compile with Bun (a CI build tool only, pinned)
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --target="bun-$target" dist/index.js --outfile "release/operator-mcp-$target"
          done
      - name: Linux binary passes the smoke script
        run: node scripts/binary-smoke.mjs ./release/operator-mcp-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries
          path: release/

  macos:
    needs: binaries
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries
          path: release
      - name: Ad-hoc sign the darwin binaries and smoke-run the native one
        run: |
          chmod +x release/operator-mcp-*
          codesign --force -s - release/operator-mcp-darwin-x64 release/operator-mcp-darwin-arm64
          release/operator-mcp-darwin-arm64 --version
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' |
            OPENPROJECT_URL=https://op.invalid OPENPROJECT_API_KEY=ci release/operator-mcp-darwin-arm64 | grep -q '"serverInfo"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: release/

  publish:
    needs: macos
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing (needs 11.5.1 or newer)
        run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tarball
          path: tarball
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed
          path: release
      - name: Checksums and the installer
        run: |
          gzip -9 release/operator-mcp-*
          cp install/install.sh release/
          cd release && sha256sum operator-mcp-*.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/operator-mcp-*.gz
            release/SHA256SUMS
            tarball/*.tgz
      - name: GitHub Release with gzipped binaries, SHA256SUMS and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/* tarball/*.tgz
      - name: Publish the tarball verify produced, to npm over OIDC
        run: npm publish tarball/*.tgz --provenance --access public
